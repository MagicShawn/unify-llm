# Central Proxy — copy to config.yaml and edit
# Primary local stack: DeepSeek + Kimi + GLM (fill keys later).

server:
  host: "127.0.0.1"   # set to "0.0.0.0" to accept LAN clients
  port: 8787
  dashboard: true

# Optional gateway auth for LAN access.
# If api_key is non-empty (or env UNIFY_GATEWAY_KEY is set),
# /v1/* and /api/* require Authorization: Bearer <key> or x-api-key: <key>.
# /healthz and /dashboard stay open.
# REQUIRED when server.host is 0.0.0.0 / :: (LAN bind).
# auth:
#   api_key: "${UNIFY_GATEWAY_KEY}"
#   # Only these TCP peers may set X-Forwarded-For / X-Real-IP.
#   # Leave empty (default) if clients talk to the gateway directly.
#   trusted_proxies: []
#   # Set true when the portal is only reached over HTTPS.
#   session_cookie_secure: false

# Failed-login / signup throttle (in-memory, per process).
# login:
#   max_failures_per_ip: 30
#   max_failures_per_account: 10
#   window_seconds: 60
#   lockout_seconds: 30

# Optional gateway rate limits (applies to /v1/* only; /api/* and /healthz are unrestricted).
# 0 or omitted disables the corresponding check.
# limits:
#   # Per client IP, token-bucket over a 60s window. Exceed → HTTP 429 + Retry-After.
#   requests_per_minute: 60
#   # Global concurrent in-flight /v1/* requests. At cap → queue or 429.
#   max_concurrent: 8
#   # How many may wait in queue when at max_concurrent. 0 = reject immediately.
#   max_queue: 32
#   # Max seconds a request may wait in queue before 429.
#   queue_timeout_seconds: 60
#   # Points quota (user API keys only; master gateway key is never charged).
#   # 0 = free (no deduction, no balance check). Non-zero enables charging:
#   #   cost = floor(prompt/1000 * points_per_1k_prompt)
#   #        + floor(completion/1000 * points_per_1k_completion)
#   #   min 1 point if any tokens and any rate > 0.
#   # Balance 0 → HTTP 402 before upstream. Balance -1 on a user = unlimited.
#   points_per_1k_prompt: 0
#   points_per_1k_completion: 0
#   # Example (1 point per 1k completion tokens, prompts free):
#   # points_per_1k_prompt: 0
#   # points_per_1k_completion: 1

defaults:
  # Idle gap allowed between upstream response chunks (seconds).
  # Long thinking models may pause >120s; 600s avoids mid-stream aborts.
  # Note: the live httpx client uses read=600s; raise this if you fork the client.
  timeout_seconds: 600
  connect_timeout_seconds: 10
  max_retries: 2
  retry_backoff_seconds: 0.8
  fallback_model: null
  # Background probe of each enabled provider (openai GET /models, anthropic GET base).
  # Set to 0 to disable background health tasks. Manual POST /api/providers/{id}/test still works.
  health_interval_seconds: 60
  # IDEs often send max_tokens=4096/8192. When true, raise the client value up to
  # model_limits.<model>.max_output_tokens so long replies are not truncated.
  # Set false to always honor the client value exactly.
  raise_max_tokens_to_model_limit: true

# Optional token cost estimation (USD). Not vendor billing — local estimate only:
#   cost = (prompt_tokens * input_rate + completion_tokens * output_rate) / 1e6
# DeepSeek rates are official USD. Kimi/GLM official prices are CNY; convert at
# ~7.2 CNY/USD before putting numbers here. Free models stay 0.
pricing:
  per_million_input: 0
  per_million_output: 0
  models: {}
  # Example (verify against vendor pages; CNY vendors converted ~7.2):
  # models:
  #   deepseek-flash: { input: 0.3, output: 1.2 }          # USD peak, cache-miss
  #   deepseek-v4-pro: { input: 1.32, output: 3.96 }
  #   kimi-k3: { input: 2.78, output: 13.89 }              # was ¥20 / ¥100
  #   glm-5.3: { input: 1.11, output: 3.89 }               # was ¥8 / ¥28
  #   glm-4.7-flash: { input: 0, output: 0 }               # free tier

# Per-model token ceilings (from vendor docs).
# max_output_tokens fills max_tokens when a client omits it on /v1/messages.
# Client-supplied max_tokens always wins. max_context_tokens is informational.
model_limits:
  deepseek-flash:
    max_output_tokens: 384000
    max_context_tokens: 1000000
  deepseek-v4-pro:
    max_output_tokens: 384000
    max_context_tokens: 1000000
  kimi-k3:
    max_output_tokens: 65536
    max_context_tokens: 1048576
  kimi-k2.7-code:
    max_output_tokens: 32768
    max_context_tokens: 262144
  kimi-k2.7-code-highspeed:
    max_output_tokens: 32768
    max_context_tokens: 262144
  kimi-k2.6:
    max_output_tokens: 32768
    max_context_tokens: 262144
  glm-5.3:
    max_output_tokens: 131072
    max_context_tokens: 1000000
  glm-5.3-flash:
    max_output_tokens: 131072
    max_context_tokens: 1000000
  glm-5.2:
    max_output_tokens: 131072
    max_context_tokens: 1000000
  glm-5.1:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-5:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-5-turbo:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-5V-Turbo:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-4.7:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-4.7-flash:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-4.6:
    max_output_tokens: 131072
    max_context_tokens: 200000
  glm-4.6V:
    max_output_tokens: 32768
    max_context_tokens: 131072

providers:
  # DeepSeek — OpenAI-compatible
  # Anthropic-compatible base (optional): https://api.deepseek.com/anthropic
  deepseek:
    type: openai
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    enabled: true
    models:
      - deepseek-flash
      - deepseek-v4-pro

  # Prefer this when the client speaks Anthropic Messages (e.g. OpenCode/Claude tools).
  # Same-protocol avoids cross-protocol tool conversion.
  # deepseek_anthropic:
  #   type: anthropic
  #   base_url: "https://api.deepseek.com/anthropic"
  #   api_key: "${DEEPSEEK_API_KEY}"
  #   enabled: true
  #   models:
  #     - deepseek-flash
  #     - deepseek-v4-pro

  # Kimi / Moonshot — OpenAI-compatible
  # Anthropic-compatible base (optional): https://api.moonshot.cn/anthropic
  kimi:
    type: openai
    base_url: "https://api.moonshot.cn/v1"
    api_key: "${KIMI_API_KEY}"
    enabled: true
    models:
      - kimi-k3
      - kimi-k2.7-code
      - kimi-k2.7-code-highspeed
      - kimi-k2.6

  # GLM / Zhipu — OpenAI-compatible chat
  # Also: anthropic https://open.bigmodel.cn/api/anthropic
  #       coding     https://open.bigmodel.cn/api/coding/paas/v4
  #       responses  https://open.bigmodel.cn/api/v1
  glm:
    type: openai
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${GLM_API_KEY}"
    enabled: true
    models:
      - glm-5.3
      - glm-5.3-flash
      - glm-5.2
      - glm-5.1
      - glm-5
      - glm-5-turbo
      - glm-5V-Turbo
      - glm-4.7
      - glm-4.7-flash
      - glm-4.6
      - glm-4.6V

  # Optional vendors (disabled by default)
  openai:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    enabled: false
    models:
      - gpt-6-astra
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna

  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    enabled: false
    models:
      - claude-opus-5

  ollama:
    type: openai
    base_url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    enabled: false
    models:
      - llama3.2

aliases:
  fast: deepseek-flash
  pro: deepseek-v4-pro
  code: kimi-k2.7-code
  glm: glm-5.3
