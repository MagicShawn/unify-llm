# Central Proxy — copy to config.yaml and edit
# Primary local stack: DeepSeek + Kimi + GLM (fill keys later).

server:
  host: "127.0.0.1"   # set to "0.0.0.0" to accept LAN clients
  port: 8787
  dashboard: true

# Optional gateway auth for LAN access.
# If api_key is non-empty (or env UNIFY_GATEWAY_KEY is set),
# /v1/* and /api/* require Authorization: Bearer <key> or x-api-key: <key>.
# /healthz and /dashboard stay open.
# auth:
#   api_key: "${UNIFY_GATEWAY_KEY}"

# Optional gateway rate limits (applies to /v1/* only; /api/* and /healthz are unrestricted).
# 0 or omitted disables the corresponding check.
# limits:
#   # Per client IP, token-bucket over a 60s window. Exceed → HTTP 429 + Retry-After.
#   requests_per_minute: 60
#   # Global concurrent in-flight /v1/* requests. At cap → HTTP 429 (no queue).
#   max_concurrent: 4

defaults:
  timeout_seconds: 120
  connect_timeout_seconds: 10
  max_retries: 2
  retry_backoff_seconds: 0.8
  fallback_model: null
  # Background probe of each enabled provider (openai GET /models, anthropic GET base).
  # Set to 0 to disable background health tasks. Manual POST /api/providers/{id}/test still works.
  health_interval_seconds: 60

# Optional token cost estimation (USD). Unify LLM does NOT call vendor billing APIs.
# It estimates cost as: (prompt_tokens * input_rate + completion_tokens * output_rate) / 1e6
# Rates are USD per 1,000,000 tokens. Leave at 0 to disable cost (tokens still count).
# After editing, reload: POST /api/admin/reload (or restart).
pricing:
  # Global fallback for any model without an override.
  per_million_input: 0
  per_million_output: 0
  # Per-model overrides (key = model id or alias). Replace rates with values from
  # each vendor's public pricing page — do not copy these numbers blindly.
  models: {}
  # models:
  #   deepseek-flash:
  #     input: 0   # USD / 1M prompt tokens
  #     output: 0  # USD / 1M completion tokens
  #   deepseek-v4-pro:
  #     input: 0
  #     output: 0
  #   kimi-k3:
  #     input: 0
  #     output: 0
  #   glm-5.3-flash:
  #     input: 0
  #     output: 0

providers:
  # DeepSeek — OpenAI-compatible
  # Anthropic-compatible base (optional): https://api.deepseek.com/anthropic
  deepseek:
    type: openai
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    enabled: true
    models:
      - deepseek-flash
      - deepseek-v4-pro

  # Kimi / Moonshot — OpenAI-compatible
  # Anthropic-compatible base (optional): https://api.moonshot.cn/anthropic
  kimi:
    type: openai
    base_url: "https://api.moonshot.cn/v1"
    api_key: "${KIMI_API_KEY}"
    enabled: true
    models:
      - kimi-k3
      - kimi-k2.7-code
      - kimi-k2.7-code-highspeed
      - kimi-k2.6

  # GLM / Zhipu — OpenAI-compatible chat
  # Also: anthropic https://open.bigmodel.cn/api/anthropic
  #       coding     https://open.bigmodel.cn/api/coding/paas/v4
  #       responses  https://open.bigmodel.cn/api/v1
  glm:
    type: openai
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${GLM_API_KEY}"
    enabled: true
    models:
      - glm-5.3
      - glm-5.3-flash
      - glm-5.2
      - glm-5.1
      - glm-5
      - glm-5-turbo
      - glm-5V-Turbo
      - glm-4.7
      - glm-4.7-flash
      - glm-4.6
      - glm-4.6V

  # Optional vendors (disabled by default)
  openai:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    enabled: false
    models:
      - gpt-6-astra
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna

  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    enabled: false
    models:
      - claude-opus-5

  ollama:
    type: openai
    base_url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    enabled: false
    models:
      - llama3.2

aliases:
  fast: deepseek-flash
  pro: deepseek-v4-pro
  code: kimi-k2.7-code
  glm: glm-5.3
